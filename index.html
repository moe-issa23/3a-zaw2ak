<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ع زوقك | 3a Zaw2ak</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fffaf4;
      color: #242424;
    }
    header {
      background: #163d2b;
      color: white;
      padding: 24px 16px;
      text-align: center;
    }
    header h1 { margin: 0 0 8px; font-size: 32px; }
    header p { margin: 0; color: #e4eee5; }
    .hero {
      padding: 28px 16px;
      text-align: center;
      background: #f3e8d5;
    }
    .hero h2 { margin: 0 0 10px; }
    .container { max-width: 760px; margin: auto; padding: 18px; }
    .card {
      background: white;
      border: 1px solid #eadfce;
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 16px;
    }
    .food { font-size: 48px; text-align: center; }
    h3 { margin: 8px 0; }
    .muted { color: #666; font-size: 14px; }
    label { display: block; margin: 14px 0 7px; font-weight: bold; }
    select, input {
      width: 100%;
      padding: 12px;
      border: 1px solid #d5d5d5;
      border-radius: 9px;
      background: white;
      font-size: 16px;
    }
    .checks { display: flex; flex-wrap: wrap; gap: 10px; }
    .checks label {
      background: #f7f3ec;
      padding: 10px;
      border-radius: 8px;
      font-weight: normal;
      margin: 0;
    }
    .checks input { width: auto; }
    .price {
      font-size: 23px;
      font-weight: bold;
      color: #17633e;
      margin: 18px 0;
    }
    button {
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 14px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      background: #17633e;
      color: white;
    }
    button:active { opacity: .8; }
    .secondary { background: #dfece2; color: #163d2b; }
    .cart-item {
      border-bottom: 1px solid #eee;
      padding: 12px 0;
      line-height: 1.8;
    }
    footer { text-align: center; padding: 24px; color: #666; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <header>
    <h1>🍽️ ع زوقك</h1>
    <p>3a Zaw2ak — طلبك، على ذوقك!</p>
  </header>
  <section class="hero">
    <h2>جعان؟ خلّيها ع زوقك! 🇱🇧</h2>
    <p>اختار أكلك، زبّط إضافاتك، وشوف السعر فورًا.</p>
  </section>
  <main class="container">
    <section class="card">
      <h2>🍕 حضّر طلبك</h2>
      <label for="food">اختار نوع الأكل</label>
      <select id="food">
        <option value="pizza">بيتزا</option>
        <option value="burger">برغر</option>
        <option value="manoushe">منقوشة</option>
      </select>
      <label for="size">الحجم</label>
      <select id="size">
        <option value="small">صغير</option>
        <option value="medium" selected>وسط</option>
        <option value="large">كبير</option>
      </select>
      <label for="quantity">الكمية</label>
      <input id="quantity" type="number" min="1" max="20" value="1">
      <label>اختار الإضافات</label>
      <div class="checks" id="extras"></div>
      <div class="price">السعر: $<span id="price">8.00</span></div>
      <button id="add">أضف إلى السلة 🛒</button>
    </section>
    <section class="card">
      <h2>🛒 سلّة طلباتك</h2>
      <div id="cart"><p class="muted">بعدك ما أضفت شي.</p></div>
      <div class="price">المجموع: $<span id="total">0.00</span></div>
      <button class="secondary" id="checkout">كمّل طلبك</button>
    </section>
    <section class="card" id="customer" hidden>
      <h2>📍 معلومات التوصيل</h2>
      <form id="orderForm">
        <label for="name">اسمك</label>
        <input id="name" required placeholder="الاسم الكامل">
        <label for="phone">رقم الهاتف</label>
        <input id="phone" type="tel" required placeholder="03 أو 70 أو 71...">
        <label for="area">المنطقة والعنوان</label>
        <input id="area" required placeholder="المدينة، الشارع، المبنى">
        <label for="notes">ملاحظات (اختياري)</label>
        <input id="notes" placeholder="مثلاً: بدون بصل">
        <button type="submit">عرض تفاصيل الطلب</button>
      </form>
      <p class="muted">هذا نموذج تجريبي. الطلب لن يُرسل إلى مطعم.</p>
      <div id="confirmation" hidden></div>
    </section>
  </main>
  <footer>صُنع بلبنان ❤️ — ع زوقك © 2026</footer>
  <script>
    const menu = {
      pizza: {
        name: "بيتزا",
        prices: { small: 5, medium: 8, large: 11 },
        extras: [
          ["جبنة زيادة", 1.5],
          ["بيبروني", 2],
          ["فطر", 1],
          ["زيتون", 0.5],
          ["ذرة", 0.5]
        ]
      },
      burger: {
        name: "برغر",
        prices: { small: 4, medium: 6, large: 8 },
        extras: [
          ["جبنة", 1],
          ["لحم إضافي", 2.5],
          ["بيكون", 2],
          ["بطاطا", 1.5],
          ["هالبينو", 0.5]
        ]
      },
      manoushe: {
        name: "منقوشة",
        prices: { small: 1.5, medium: 2.5, large: 3.5 },
        extras: [
          ["جبنة", 1],
          ["خضرة", 0.5],
          ["زيتون", 0.5],
          ["لبنة", 1],
          ["زعتر زيادة", 0.5]
        ]
      }
    };
    const $ = id => document.getElementById(id);
    let cart = [];
    function renderExtras() {
      const item = menu[$("food").value];
      $("extras").replaceChildren();
      item.extras.forEach(([name, cost], index) => {
        const label = document.createElement("label");
        const input = document.createElement("input");
        input.type = "checkbox";
        input.dataset.cost = cost;
        input.value = name;
        input.id = "extra" + index;
        input.addEventListener("change", updatePrice);
        label.append(input, " " + name + " (+$" + cost.toFixed(2) + ")");
        $("extras").append(label);
      });
      updatePrice();
    }
    function getPrice() {
      const item = menu[$("food").value];
      const base = item.prices[$("size").value];
      const extras = [...$("extras").querySelectorAll("input:checked")]
        .reduce((sum, input) => sum + Number(input.dataset.cost), 0);
      const quantity = Math.max(1, Math.min(20, Number($("quantity").value) || 1));
      return { unit: base + extras, quantity };
    }
    function updatePrice() {
      const { unit, quantity } = getPrice();
      $("price").textContent = (unit * quantity).toFixed(2);
    }
    function renderCart() {
      $("cart").replaceChildren();
      if (!cart.length) {
        const p = document.createElement("p");
        p.className = "muted";
        p.textContent = "بعدك ما أضفت شي.";
        $("cart").append(p);
      } else {
        cart.forEach((item, index) => {
          const div = document.createElement("div");
          div.className = "cart-item";
          const description = document.createElement("div");
          description.textContent =
            item.name + " — " + item.size + " — كمية " +
            item.quantity + (item.extras.length ? " — " + item.extras.join("، ") : "") +
            " — $" + item.total.toFixed(2);
          const remove = document.createElement("button");
          remove.className = "secondary";
          remove.textContent = "حذف";
          remove.style.marginTop = "8px";
          remove.addEventListener("click", () => {
            cart.splice(index, 1);
            renderCart();
          });
          div.append(description, remove);
          $("cart").append(div);
        });
      }
      $("total").textContent =
        cart.reduce((sum, item) => sum + item.total, 0).toFixed(2);
    }
    $("food").addEventListener("change", renderExtras);
    $("size").addEventListener("change", updatePrice);
    $("quantity").addEventListener("input", updatePrice);
    $("add").addEventListener("click", () => {
      const food = menu[$("food").value];
      const { unit, quantity } = getPrice();
      const extras = [...$("extras").querySelectorAll("input:checked")]
        .map(input => input.value);
      cart.push({
        name: food.name,
        size: $("size").selectedOptions[0].textContent,
        quantity,
        extras,
        total: unit * quantity
      });
      renderCart();
      $("customer").hidden = false;
    });
    $("checkout").addEventListener("click", () => {
      if (!cart.length) {
        alert("أضف أكلة إلى السلّة أولاً!");
        return;
      }
      $("customer").hidden = false;
      $("customer").scrollIntoView({ behavior: "smooth" });
    });
    $("orderForm").addEventListener("submit", event => {
      event.preventDefault();
      const order = {
        customer: $("name").value.trim(),
        phone: $("phone").value.trim(),
        address: $("area").value.trim(),
        notes: $("notes").value.trim(),
        items: cart,
        total: $("total").textContent
      };
      $("confirmation").hidden = false;
      $("confirmation").replaceChildren();
      const title = document.createElement("h3");
      title.textContent = "تم تجهيز ملخّص طلبك التجريبي ✅";
      const details = document.createElement("pre");
      details.style.whiteSpace = "pre-wrap";
      details.textContent = JSON.stringify(order, null, 2);
      const warning = document.createElement("p");
      warning.className = "muted";
      warning.textContent =
        "هذا الطلب لم يُرسل إلى أي مطعم، ولم تُحفظ بياناتك على خادم.";
      $("confirmation").append(title, details, warning);
    });
    
$("orderForm").addEventListener("submit", event => {
  event.preventDefault();

  if (!cart.length) {
    alert("أضف أكلة إلى السلّة أولاً!");
    return;
  }

  const customer = $("name").value.trim();
  const phone = $("phone").value.trim();
  const address = $("area").value.trim();
  const notes = $("notes").value.trim();

  const lines = [
    "🍽️ *طلب جديد من ع زوقك | 3a Zaw2ak*",
    "",
    "👤 الاسم: " + customer,
    "📞 هاتف الزبون: " + phone,
    "📍 العنوان: " + address,
    "",
    "🛒 *تفاصيل الطلب:*",
    ...cart.map((item, i) =>
      (i + 1) + ". " + item.name +
      " - الحجم: " + item.size +
      " - الكمية: " + item.quantity +
      (item.extras.length
        ? " - الإضافات: " + item.extras.join("، ")
        : "") +
      " - السعر: $" + item.total.toFixed(2)
    ),
    "",
    "💰 *المجموع: $" + $("total").textContent + "*",
    "📝 ملاحظات: " + (notes || "لا يوجد"),
    "",
    "تم إنشاء الطلب عبر موقع ع زوقك."
  ];

  const message = lines.join("\n");
  const whatsappNumber = "96176058727";
  const whatsappURL =
    "https://wa.me/" + whatsappNumber +
    "?text=" + encodeURIComponent(message);

  window.open(whatsappURL, "_blank");
});

  </script>
</body>
</html>
